// Debug facilities
const __params = new URLSearchParams(window.location.search);
let debugEnabled = __params.get('debug') === '1';
// Persisted categories
const __DBG_STORE_KEY = 'shogi.debug.cats.v1';
let debugCategories = { engine:true, game:true, state:true, move:true, board:false, candidate:true, kif:true, csa:true, ws:true, perf:false };
try {
  const saved = localStorage.getItem(__DBG_STORE_KEY);
  if (saved) {
    const parsed = JSON.parse(saved);
    if (parsed && typeof parsed === 'object') debugCategories = { ...debugCategories, ...parsed };
  }
} catch(_) {}
function setDebugCategory(cat, on){ debugCategories[cat]=!!on; try{ localStorage.setItem(__DBG_STORE_KEY, JSON.stringify(debugCategories)); }catch(_){} }
function debugLog(category, message, obj){
  try{
    if(!debugEnabled) return;
    if(!debugCategories[category]) return;
    const ts = new Date().toLocaleTimeString();
    const base = `[${ts}] DBG[${category}] ${message}`;
    if (obj!==undefined) {
      const json = (()=>{ try{ return JSON.stringify(obj); }catch(e){ return String(obj); } })();
      log(base+"\n  "+json);
    } else {
      log(base);

<script>
let candidateMoves = [];
let candidateMovesEnabled = true;
// 候補手の表記をクライアント側で一貫生成するための手番メモ
let candidateSideOverride = null; // サーバ応答の current_player を保持（なければ gameState を利用）

// USIからKIF風表記を生成（サーバの簡易"歩"表記を置き換える）
function notationFromUSI(usiMove, sideOpt){
  try {
    if (!usiMove || typeof usiMove !== 'string') return '';
    const side = sideOpt || candidateSideOverride || (gameState && (gameState.current_player || gameState.currentPlayer)) || 'b';
    const sim = cloneBoardState();
    return usiToKif(usiMove, side, (sq)=>pieceAtFromBoard(sim, sq));
  } catch (e) {
    debugLog('candidate', 'notationFromUSI error', { err: String(e), usi: usiMove });
    return '';
  }
}

// 候補手表示の更新
function updateCandidateMoves(moves) {
  candidateMoves = moves || [];
  const container = document.getElementById('candidate-moves');
  if (!container) return;
  
  if (!candidateMoves.length || !candidateMovesEnabled) {
    container.innerHTML = '<div class="no-candidates">候補手がありません</div>';
    return;
  }
  
  // 候補手の選択状態をリセット
  document.querySelectorAll('.candidate-move.selected').forEach(el => {
    el.classList.remove('selected');
  });
  
  container.innerHTML = candidateMoves.map((move, index) => {
    // サーバ提供の簡易notation（常に歩）ではなく、クライアント側で正しい駒種に基づき生成
    const computed = notationFromUSI(move.move || '', candidateSideOverride);
    const notation = computed || move.notation || move.move || '不明';
    const eval_str = move.eval ? formatCandidateEval(move.eval) : '';
    const eval_class = move.eval ? (move.eval > 0 ? 'positive' : move.eval < 0 ? 'negative' : '') : '';
    
    return `
      <div class="candidate-move" data-move="${move.move || ''}" onclick="selectCandidateMove('${move.move || ''}', ${index})">
        <span class="move-notation">${notation}</span>
        ${eval_str ? `<span class="move-eval ${eval_class}">${eval_str}</span>` : ''}
      </div>
    `;
  }).join('');
}

// 候補手の評価値を整形
function formatCandidateEval(eval_val) {
  if (typeof eval_val === 'number') {
    return eval_val > 0 ? `+${eval_val}` : `${eval_val}`;
  }
  return '';
}

// 候補手をクリックした時の処理
function selectCandidateMove(usiMove, index) {
  if (!usiMove || !candidateMovesEnabled) return;
  if (thinking) {
    toast('エンジン思考中は候補手を選択できません', false);
    return;
  }
  
  log(`💡 候補手選択: ${usiMove}`);
  
  // 既存の選択をクリア
  document.querySelectorAll('.candidate-move.selected').forEach(el => {
    el.classList.remove('selected');
  });
  
  // 選択した候補手をハイライト
  const moveEl = document.querySelector(`[data-move="${usiMove}"]`);
  if (moveEl) {
    moveEl.classList.add('selected');
  }
  
  // 候補手をクリアしてから指し手を実行
  updateCandidateMoves([]);
  
  // 指し手を実行
  sendHumanMove(usiMove);
}

// 候補手の有効/無効切り替え
function setCandidateMovesEnabled(enabled) {
  candidateMovesEnabled = enabled;
  log(`💡 候補手機能: ${enabled ? '有効' : '無効'}`);
  if (!enabled) {
    document.getElementById('candidate-moves').innerHTML = '<div class="no-candidates">候補手機能は無効です</div>';
  }
}

// 現在の局面から候補手を取得
function fetchCandidateMoves() {
  if (!candidateMovesEnabled || !gameState || thinking) return;
  
  const payload = {
    position: 'startpos',
    moves: gameState.moves || [],
    current_player: gameState.current_player || 'b'
  };
  debugLog('candidate', 'fetchCandidateMoves payload', payload);
  
  // CSRFトークンを取得
  const csrfToken = document.querySelector('meta[name=csrf-token]')?.getAttribute('content');
  
  const headers = {
    'Content-Type': 'application/json',
  };
  
  if (csrfToken) {
    headers['X-CSRFToken'] = csrfToken;
  }
  
  fetch('/shogi/api/candidate-moves', {
    method: 'POST',
    headers: headers,
    body: JSON.stringify(payload)
  })
  .then(response => {
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }
    return response.json();
  })
  .then(data => {
    debugLog('candidate', 'fetchCandidateMoves response', data);
    if (data.success) {
      // 手番情報を保持し、表記生成の基準に使う
      try { candidateSideOverride = data.current_player || null; } catch(_) { candidateSideOverride = null; }
      updateCandidateMoves(data.candidate_moves);
    } else {
      log(`⚠️ 候補手取得失敗: ${data.error || 'Unknown error'}`);
      // サーバーエラー時はデモ候補手を表示
      const demoCandidates = generateDemoCandidates();
      updateCandidateMoves(demoCandidates);
    }
  })
  .catch(error => {
    debugLog('candidate', 'fetchCandidateMoves error', { message: error?.message||String(error) });
    log(`💥 候補手取得エラー: ${error.message || error}`);
    // ネットワークエラー時はデモ候補手を表示
    const demoCandidates = generateDemoCandidates();
    updateCandidateMoves(demoCandidates);
  });
}

// デモ用候補手生成（後でサーバーAPIに置き換え）
function generateDemoCandidates() {
  if (!gameState || !gameState.moves) return [];
  
  const currentPlayer = gameState.current_player || 'b';
  
  // 簡単なデモ候補手
  const demos = [
    { move: '7g7f', notation: '▲７六歩', eval: 15 },
    { move: '2g2f', notation: '▲２六歩', eval: 8 },
    { move: '6g6f', notation: '▲６六歩', eval: 5 },
    { move: '1g1f', notation: '▲１六歩', eval: -2 },
    { move: '9g9f', notation: '▲９六歩', eval: -5 }
  ];
  
  return demos.slice(0, 3); // 上位3手のみ表示
}

function usiToKif(usi, side, pieceAt = pieceAtKIF, useDou = true){
  const turnMark = side === 'b' ? '▲' : '△';
  if (usi.includes('*')){
    const [p,_] = usi.split('*');
    const to = usi.slice(2,4);
    const name = PIECE_JP[p.toUpperCase()]?.[0] || '？';
    const dst  = sqToJP(to); // 打は常に座標
    if (useDou) lastToSq = to;
    return `${turnMark}${dst}${name}打`;
  }
  const promote = usi.endsWith('+');
  const core = promote ? usi.slice(0,-1) : usi;
  const from = core.slice(0,2);
  const to   = core.slice(2,4);
  const mover = pieceAt(from);
  try { debugLog('kif','usiToKif.mover', { usi, side, from, to, mover }); } catch(_) {}
  const name  = pieceNameJP(mover);
  const dst   = (useDou && to === lastToSq) ? '同　' : sqToJP(to);

  return `${turnMark}${dst}${name}${promote ? '成' : ''}`;

function usiSqToCSA(sq){ if(!sq||sq.length<2) return '00'; const f=sq[0]; const r=sq[1]; return `${f}${RANK_NUM[r]||'?'}`; }
function pieceToCSA(piece){ if(!piece) return '??'; const base=CSA_PIECE[piece.type?.toUpperCase()]||'??'; if(piece.promoted) return CSA_PROMOTED[piece.type?.toUpperCase()]||base; return base; }
function usiToCSA(usi, side, board){

function parseUSI(usi){ if(!usi) return null; if(usi.includes('*')){ const [pt,_]=usi.split('*'); const to=usi.slice(2,4); return {drop:true, pt:pt.toUpperCase(), from:null, to, promote:false}; } const from=usi.slice(0,2); const to=usi.slice(2,4); const promote=usi.length===5&&usi.endsWith('+'); return {drop:false, pt:null, from, to, promote}; }
function sqToXYSimple(sq){ const f='123456789'.indexOf(sq[0]); const r='abcdefghi'.indexOf(sq[1]); return {x:8-f, y:r}; }

function isSlidingPiece(pt){ return ['B','R','L'].includes(pt); }
function delta(from,to){ const a=sqToXYSimple(from), b=sqToXYSimple(to); return {dx:b.x-a.x, dy:b.y-a.y}; }
function pathIsClear(from,to){ const {dx,dy}=delta(from,to); const steps=Math.max(Math.abs(dx),Math.abs(dy)); if(steps<=1) return true; const sx=dx===0?0:dx/Math.abs(dx); const sy=dy===0?0:dy/Math.abs(dy); let {x,y}=sqToXYSimple(from); for(let i=1;i<steps;i++){ x+=sx; y+=sy; if(boardState[y][x]) return false; } return true; }
function basicMoveConforms(pt, from, to, side){ const {dx,dy}=delta(from,to); const fwd=(side==='b')?-1:1; const adx=Math.abs(dx), ady=Math.abs(dy); switch(pt){ case 'P': return dx===0&&dy===fwd; case 'L': return dx===0&&((fwd===-1&&dy<0)||(fwd===1&&dy>0)); case 'N': return adx===1&&dy===2*fwd; case 'S': return (dy===fwd&&adx<=1)||(dy===-fwd&&adx===1); case 'G': case 'K': { if(pt==='K') return adx<=1&&ady<=1; if(dy===fwd&&adx<=1) return true; if(dy===0&&adx===1) return true; if(dy===-fwd&&dx===0) return true; return false; } case 'B': return adx===ady; case 'R': return (dx===0||dy===0); case '+B': return adx===ady||(adx<=1&&ady<=1); case '+R': return (dx===0||dy===0)||(adx===1&&ady===1); case '+P': case '+L': case '+N': case '+S': return basicMoveConforms('G', from, to, side); default: return true; } }

function wsURL(){
  const cfg = (window.ENGINE_CONFIG||{});
  if (cfg.ws_url) return cfg.ws_url; // Flask から注入（/ws を含む）
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  // 旧WS直結フォールバック時も 8787 に統一
  return 'ws://127.0.0.1:8787/ws' + (token ? ('?token='+encodeURIComponent(token)) : '');
}

    // 接続直後に一度だけ自動で対局を開始
    if (!window.__AUTO_STARTED__) { window.__AUTO_STARTED__ = true; try { newGame(); } catch(e) { log('auto newGame failed: '+e); } }
  };
  ws.onmessage=function(ev){ const data=JSON.parse(ev.data); handleMessage(data); };
  ws.onclose=function(ev){ updateStatus('接続が切断されました', 'error'); log(`❌ WebSocket切断 code=${ev.code} reason=${ev.reason||'(none)'} url=${ws.url}`); stopHeartbeat(); hasControl=false; gameReady=false; lastLocalMove=null; thinking=false; setBoardEnabled(false); scheduleReconnect(); };
  ws.onerror=function(error){ updateStatus('接続エラーが発生しました', 'error'); log('💥 WebSocketエラー: '+error+` url=${ws.url}`); };
} catch (e){ updateStatus('接続に失敗しました: '+e, 'error'); log('💥 接続失敗: '+e); } }

  case 'pong': return;
  case 'state': try{ restoreFromState(data); }catch(e){ log('restoreFromState失敗: '+e);} return;
  case 'game': if(data.status==='GAME_OVER'){ markThinking(false); gameReady=false; gameInterrupted=true; setBoardEnabled(false); setCandidateMovesEnabled(false); const reason=(data.result && data.result.reason)||''; const engineWon=(data.result&&(data.result.winner==='engine'||data.result.result==='engine-win')) || reason==='resign'; const who=engineWon?'水匠':'あなた'; const msg=`🏁 終局: ${reason} / 勝者: ${who}`; log(msg); try{ toast(msg, true);}catch{} return; } if(data.event==='new'){ gameState=data.state||{moves:[], current_player:'b'}; hasControl=true; gameReady=true; thinking=false; lastLocalMove=null; lastEngineApplied=null; log('🎮 新規ゲーム開始'); resetHands(); resetToStartpos(); if (gameState.moves&&gameState.moves.length) replayMoves(gameState.moves); setBoardEnabled(hasControl); markThinking(false); flushQueuedMove(); setTimeout(() => fetchCandidateMoves(), 300); } else if (data.event==='state'){ gameState=data.state||gameState||{moves:[], current_player:'b'}; lastEngineApplied=null; resetHands(); resetToStartpos(); if (gameState.moves&&gameState.moves.length) replayMoves(gameState.moves); gameReady=true; setBoardEnabled(hasControl); markThinking(false); log(`♻️ 状態復元: ${gameState.moves.length||0}手`); flushQueuedMove(); setTimeout(() => fetchCandidateMoves(), 300); } else if (data.event==='humanMove' || data.event==='human' || data.event==='move'){ gameState=data.state||gameState; const mv=data.lastMove||data.move||data.usi; if(!mv) return; if(mv!==lastLocalMove){ const simBefore=cloneBoardState(); const core = mv.endsWith('+') ? mv.slice(0,-1) : mv; const fromSq = mv.includes('*') ? null : core.slice(0,2); let sideForKif = (gameState&&(gameState.current_player||gameState.currentPlayer))||'b'; if (fromSq){ const pa = pieceAtFromBoard(simBefore, fromSq); if (pa && pa.side) sideForKif = pa.side; } const kifTxt=usiToKif(mv, sideForKif, (sq)=>pieceAtFromBoard(simBefore, sq), true); applyMoveToBoard(mv, {authoritative:true, side: sideForKif}); log(`♟️ ${kifTxt}`); pushKif(mv, sideForKif, (sq)=>pieceAtFromBoard(simBefore, sq)); } } else if (data.event==='bestmove'){ 
    try { if (goFallbackTimer) { clearTimeout(goFallbackTimer); goFallbackTimer = null; } } catch(_) {}
    // ペンディングしているフォールバック適用はキャンセル
    if (pendingEngineMoveTimer) { try { clearTimeout(pendingEngineMoveTimer); } catch(_) {} pendingEngineMoveTimer = null; pendingEngineMove = null; }
  debugLog('game', 'bestmove event received', { mv: data.lastMove||data.move, lastEngineApplied });
    gameState=data.state||gameState; 
    let mv=data.lastMove||data.move; 
    // bestmove正規化：空文字・resign・win除去、有効性チェック
    if (typeof mv === "string" && mv.trim()) {
      mv = mv.trim();
      if (mv === "resign" || mv === "win") mv = null;
    } else {
      mv = null;
    }
    if(mv){ 
      const plyFromMoves = (gameState && Array.isArray(gameState.moves)) ? gameState.moves.length + 1 : (currentGamePly + 1);
      const moveKey = {move: mv, ply: plyFromMoves};
      // 重複チェック：同じ手かつ同じ手数なら適用済み
      if (lastEngineApplied && lastEngineApplied.move === mv && lastEngineApplied.ply === plyFromMoves) {
        debugLog('game', 'bestmove duplicate skip', { mv, ply: plyFromMoves });
        return;
      }
  const simBefore=cloneBoardState(); 
  const core = mv.endsWith('+') ? mv.slice(0,-1) : mv;
  const fromSq = mv.includes('*') ? null : core.slice(0,2);
  let sideForKif = (gameState&&(gameState.current_player||gameState.currentPlayer))||'b';
  if (fromSq){ const pa = pieceAtFromBoard(simBefore, fromSq); if (pa && pa.side) sideForKif = pa.side; }
  const kifTxt=usiToKif(mv, sideForKif, (sq)=>pieceAtFromBoard(simBefore, sq), true); 
  applyMoveToBoard(mv, {authoritative:true, side: sideForKif}); 
  log(`🤖 ${kifTxt} (ply=${plyFromMoves})`); 
  debugLog('move','applied engine bestmove', { mv, ply: plyFromMoves });
  pushKif(mv, sideForKif, (sq)=>pieceAtFromBoard(simBefore, sq));
      try {
        if (!gameState) gameState = { moves: [], current_player: 'b' };
        if (!Array.isArray(gameState.moves)) gameState.moves = [];
        gameState.moves.push(mv);
        gameState.current_player = (gameState.current_player === 'b') ? 'w' : 'b';
      } catch(_) {}
      lastEngineApplied = moveKey; // 適用成功後に記録
    } else { 
  log('🤖 bestmove無効またはresign/win'); 
  debugLog('game','bestmove invalid', { mvRaw: data.lastMove||data.move });
    } 
    lastLocalMove=null; 
    markThinking(false); 
    // bestmove後に候補手を更新（少し遅延を置いて確実に）
    setTimeout(() => {
      if (!thinking && hasControl && gameReady) {
        debugLog('candidate','post-bestmove fetch');
        fetchCandidateMoves();
      }
    }, 500);
} break;
  case 'error': log(`💥 エラー [${data.code}]: ${data.message}`); updateStatus(`エラー: ${data.code}`, 'error'); if(data.code==='NOT_CONTROLLER'){ hasControl=false; setBoardEnabled(false); log('⚠ NOT_CONTROLLER → 再要求'); try{ sendObj({type:'takeControl'}); }catch(e){} 
    // 楽観的に制御権を立ててフラッシュ（サーバ側で拒否される場合は再度NOT_CONTROLLERが返る）
    hasControl=true; setBoardEnabled(true); try{ flushQueuedMove(); }catch(e){}
  } if(data.code==='ILLEGAL_MOVE'||data.code==='PARSE_ERROR'){ log('🏳️ 不正手検出 → 投了扱いで対局終了'); lastBoardSnapshot=null; lastHandsSnapshot=null; lastLocalMove=null; markThinking(false); gameInterrupted=true; setBoardEnabled(false); toast(`不正な指し手 (${data.message||data.move||''}) により投了扱い`, false); clearSelection(); const ind=document.getElementById('turn-indicator'); if(ind) ind.textContent='対局終了 (不正手による投了)'; } break;
  case 'parsed': { const d=(typeof data.depth==='number')?data.depth:(typeof data['depth(深さ)']==='number'?data['depth(深さ)']:undefined); const st=data.scoreType; const sv=data.scoreValue; const n=(typeof data.nps==='number')?data.nps:(typeof data['nps(探索局面数)']==='number'?data['nps(探索局面数)']:undefined); const parts=[]; if(typeof d==='number') parts.push(`深さ ${d}`); if(st==='cp'&&typeof sv==='number'){ const disp=-sv; const sign=disp>=0?`+${disp}`:`${disp}`; parts.push(`評価 ${sign}（${advantageLabel(disp)}）`); } else if(st==='mate'&&typeof sv==='number'){ parts.push(`詰み #${sv}`); } if(typeof n==='number') parts.push(`探索局面数 NPS ${formatNps(n)}`); if(parts.length) log('🧮 '+parts.join(' | ')); else log('🧮 解析: '+JSON.stringify(data)); return; }
  default: log('📨 受信: '+JSON.stringify(data, null, 2)); }
}

function restoreFromState(snap){ if(!snap) return; const moves=snap.moves||[]; const side=snap.side_to_move||'b'; gameState={ moves:moves.slice(), current_player: side }; resetHands(); resetToStartpos(); if(moves.length) replayMoves(moves); gameReady=!!snap.in_game || moves.length>0; setBoardEnabled(hasControl); markThinking(false); 
  // 状態復元後に候補手を更新
  setTimeout(() => fetchCandidateMoves(), 200);
  log(`♻️ 状態復元(state): ${moves.length}手 / 手番=${side}`); 
  debugLog('state','restored from state', { len: moves.length, side });
}

function applyMoveToBoard(usi, opts={}){ if(!usi) return false; const optimistic=!!opts.optimistic; log(`🔄 盤面反映: ${usi}${optimistic?' (optimistic)':''}`); try{ if(usi.includes('*')){ const letter=usi[0]; const targetSq=usi.slice(2,4); const {x,y}=usiSqToXY(targetSq); if(boardState[y][x]){ log('⚠️ 打ち先に駒があります: '+targetSq); return false; } const sideDetected=opts.side || (gameState&&(gameState.current_player||gameState.currentPlayer)) || 'b'; const piecePlaced= sideDetected==='b' ? letter.toUpperCase() : letter.toLowerCase(); boardState[y][x]=piecePlaced; useHandPieceForDrop(letter, sideDetected); const pieceText=document.getElementById(`piece-${x}-${y}`); if(pieceText){ pieceText.textContent=pieceNames[piecePlaced]||piecePlaced; pieceText.style.fill= piecePlaced===piecePlaced.toUpperCase()? '#000':'#c00'; pieceText.setAttribute('data-piece', piecePlaced); setPieceOrientation(pieceText, piecePlaced); } else { const svg=document.getElementById('shogi-board'); const text=document.createElementNS('http://www.w3.org/2000/svg','text'); text.setAttribute('x', BOARD_OFFSET_X + x * CELL_SIZE + CELL_SIZE / 2); text.setAttribute('y', BOARD_OFFSET_Y + y * CELL_SIZE + CELL_SIZE / 2); text.setAttribute('text-anchor','middle'); text.setAttribute('alignment-baseline','middle'); text.setAttribute('font-size','18'); text.setAttribute('font-weight','bold'); text.classList.add('piece-text'); text.setAttribute('data-file', x); text.setAttribute('data-rank', y); text.setAttribute('id', `piece-${x}-${y}`); text.setAttribute('data-piece', piecePlaced); text.textContent=pieceNames[piecePlaced]||piecePlaced; text.style.fill= piecePlaced===piecePlaced.toUpperCase()? '#000':'#c00'; setPieceOrientation(text, piecePlaced); svg.appendChild(text); } } else { const fromSq=usi.slice(0,2); const toSq=usi.slice(2,4); const promote=usi.endsWith('+'); const from=usiSqToXY(fromSq); const to=usiSqToXY(toSq); let piece=boardState[from.y][from.x]; if(!piece){ log(`⚠️ 移動元が空: ${fromSq}`); return false; } let captured=boardState[to.y][to.x]; if(promote){ piece='+'+piece.replace('+',''); } boardState[to.y][to.x]=piece; boardState[from.y][from.x]=null; const fromPieceText=document.getElementById(`piece-${from.x}-${from.y}`); if(fromPieceText) fromPieceText.remove(); const toPieceText=document.getElementById(`piece-${to.x}-${to.y}`); if(captured){ addCaptureToHand(captured); }
    if(toPieceText){ toPieceText.textContent=pieceNames[piece]||piece; toPieceText.style.fill= piece.toLowerCase()===piece? '#c00':'#000'; toPieceText.setAttribute('data-piece', piece); setPieceOrientation(toPieceText, piece); } else { const svg=document.getElementById('shogi-board'); const text=document.createElementNS('http://www.w3.org/2000/svg','text'); text.setAttribute('x', BOARD_OFFSET_X + to.x * CELL_SIZE + CELL_SIZE / 2); text.setAttribute('y', BOARD_OFFSET_Y + to.y * CELL_SIZE + CELL_SIZE / 2); text.setAttribute('text-anchor','middle'); text.setAttribute('alignment-baseline','middle'); text.setAttribute('font-size','18'); text.setAttribute('font-weight','bold'); text.classList.add('piece-text'); text.setAttribute('data-file', to.x); text.setAttribute('data-rank', to.y); text.setAttribute('id', `piece-${to.x}-${to.y}`); text.setAttribute('data-piece', piece); text.textContent=pieceNames[piece]||piece; text.style.fill= piece.toLowerCase()===piece? '#c00':'#000'; setPieceOrientation(text, piece); svg.appendChild(text); }
  } return true; } catch(e){ log(`💥 applyMoveToBoard失敗: ${e}`); return false; } }

function resetToStartpos(){ boardState=createStartpos(); document.querySelectorAll('.piece-text').forEach(el=>el.remove()); const svg=document.getElementById('shogi-board'); for(let rank=0;rank<9;rank++){ for(let file=0;file<9;file++){ const piece=boardState[rank][file]; if(piece){ const text=document.createElementNS('http://www.w3.org/2000/svg','text'); text.setAttribute('x', BOARD_OFFSET_X + file * CELL_SIZE + CELL_SIZE / 2); text.setAttribute('y', BOARD_OFFSET_Y + rank * CELL_SIZE + CELL_SIZE / 2); text.setAttribute('text-anchor','middle'); text.setAttribute('alignment-baseline','middle'); text.setAttribute('font-size','18'); text.setAttribute('font-weight','bold'); text.classList.add('piece-text'); text.setAttribute('data-file', file); text.setAttribute('data-rank', rank); text.setAttribute('id', `piece-${file}-${rank}`); text.textContent=pieceNames[piece]||piece; text.style.fill= piece===piece.toUpperCase()? '#000':'#c00'; setPieceOrientation(text, piece); svg.appendChild(text); } } } 
  // 盤面リセット時に候補手もクリア
  updateCandidateMoves([]);
  log('🔄 盤面リセット完了'); }
function replayMoves(moves){ if(!moves||moves.length===0) return; log(`🔄 手順再生: ${moves.length}手`); moves.forEach((mv,i)=>{ log(`  ${i+1}手目: ${mv}`); applyMoveToBoard(mv); }); }
function displayKIF(kifContent){ const w=window.open('', '_blank', 'width=600,height=400'); w.document.write(`<html><head><title>生成されたKIF</title></head><body style="font-family: monospace; white-space: pre; padding: 20px;">${kifContent}</body></html>`); }
function updateStatus(message,type){ const el=document.getElementById('status'); el.textContent=message; el.className='status '+type; }
function log(message){ const el=document.getElementById('log'); const ts=new Date().toLocaleTimeString(); el.textContent += '['+ts+'] '+message+'\n'; el.scrollTop=el.scrollHeight; }
function clearLog(){ document.getElementById('log').textContent='ログクリア...\n'; }
function toast(message,isSuccess=true){ const sEl=document.getElementById('status'); const orig=sEl.textContent; const cls=sEl.className; updateStatus(message, isSuccess?'connected':'error'); setTimeout(()=>{ sEl.textContent=orig; sEl.className=cls; }, 3000); }
function clearSelection(){ if(selectedSquare){ selectedSquare.square.classList.remove('selected'); selectedSquare=null; } if(selectedDropPiece){ const pieceEl=document.querySelector(`[data-piece="${selectedDropPiece}"].selected`); if(pieceEl) pieceEl.classList.remove('selected'); selectedDropPiece=null; } document.querySelectorAll('.square.possible').forEach(sq=>sq.classList.remove('possible')); legalTargets.clear(); }
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ clearSelection(); document.getElementById('promotionModal').style.display='none'; if(pendingMove){ log('成り選択キャンセル'); pendingMove=null; } } });
window.onload=function(){ boardState=createStartpos(); initSVGBoard(); updateKomadaiDisplay(); log('🎌 SVG将棋盤クリック入力システム起動（駒台対応）'); updateStatus('自動接続中...', 'info'); };

// 軽量デバッグ: 棋譜の更新状況をコンソールから確認するためのヘルパ

  window.getMovesDebug = function(){
    try{
      const ms = (gameState && Array.isArray(gameState.moves)) ? gameState.moves : [];
      return { count: ms.length, last: ms.slice(-5), current_player: (gameState && gameState.current_player) || 'b' };
    } catch(e){ return { error: String(e) } }
  };
} catch(_) {}
