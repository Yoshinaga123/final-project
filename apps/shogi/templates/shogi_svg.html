  <script>

        const url = wsURL(); log(`🔌 接続開始: ${url}`); ws = new WebSocket(url);
        ws.onopen = function () { updateStatus('水匠に接続しました', 'connected'); log('✅ WebSocket接続成功'); reconnectAttempts = 0; if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; } startHeartbeat(); sendObj({ type: 'takeControl' }); log('📝 takeControl 要求送信'); hasControl = true; setBoardEnabled(true); try { sendObj({ type: 'getState' }); } catch (e) { } };
        ws.onmessage = function (ev) { const data = JSON.parse(ev.data); handleMessage(data); };
        ws.onclose = function (ev) { updateStatus('接続が切断されました', 'error'); log(`❌ WebSocket切断 code=${ev.code} reason=${ev.reason || '(none)'} url=${ws.url}`); stopHeartbeat(); hasControl = false; gameReady = false; lastLocalMove = null; thinking = false; setBoardEnabled(false); scheduleReconnect(); };
        ws.onerror = function (error) { updateStatus('接続エラーが発生しました', 'error'); log('💥 WebSocketエラー: ' + error + ` url=${ws.url}`); };
      } catch (e) { updateStatus('接続に失敗しました: ' + e, 'error'); log('💥 接続失敗: ' + e); }
    }

    let reconnectAttempts = 0; let reconnectTimer = null; function scheduleReconnect() { if (reconnectTimer) return; const delay = Math.min(10000, 1500 * Math.pow(2, reconnectAttempts)); reconnectAttempts = Math.min(reconnectAttempts + 1, 6); log(`⏳ 再接続をスケジュール: ${delay}ms`); reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, delay); }
    let hbTimer = null; function startHeartbeat() {
      // アダプタ使用時はサーバのプロトコル ping に任せる（アプリ層 ping 無効化）
      if (isAdapter()) return;
      // 旧WSフォールバック時のみ、軽い状態プローブを実施（過剰に送らない）
      stopHeartbeat();
      hbTimer = setInterval(() => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        try { ws.send(JSON.stringify({ type: 'getState' })); } catch (e) { }
      }, 15000);
    }
    function stopHeartbeat() { if (hbTimer) { clearInterval(hbTimer); hbTimer = null; } }

    window.addEventListener('DOMContentLoaded', () => { if (!isAdapter()) connect(); });

    function disconnect() { log('ℹ️ 手動切断は無効化されています'); }
    function newGame() {
      if (!isConnected()) { updateStatus('水匠に接続してください', 'error'); return; }
      gameInterrupted = false; setBoardEnabled(true);
      // 楽観的にUI初期化（サーバのnew/stateで上書きされます）
      try { resetHands(); } catch (e) {}
      try { resetToStartpos(); } catch (e) {}
      try { if (Array.isArray(kifMoves)) kifMoves.length = 0; lastToSq = null; } catch (e) {}
      gameState = { moves: [], current_player: 'b' };
      gameReady = true; markThinking(false);
      // 既存仕様: movetime を添えて送信 → サーバ側で position 直後に go を自動送信
      const MOVETIME_MS = (window.ENGINE_CONFIG && window.ENGINE_CONFIG.movetime_ms) || 2000;
  // 人間が先手（sente）、水匠は後手（gote）のため、エンジンの自動初手は打たせない
  sendObj({ type: 'gameNew', gameId: 'svg-click-game-' + Date.now(), position: 'startpos', movetime: MOVETIME_MS, engineStarts: false });
      try { sendObj({ type: 'takeControl' }); } catch (e) {}
      try { sendObj({ type: 'getState' }); } catch (e) {}
      log('🎮 新規ゲーム開始リクエスト送信');
    }
    function generateKIF() { if (!isConnected()) { updateStatus('水匠に接続してください', 'error'); return; } if (!gameState || !gameState.moves || gameState.moves.length === 0) { toast('対局データがありません（0手）', false); return; } const gameInfo = { black_player: '人間', white_player: 'YaneuraOu NNUE', date: new Date().toISOString().split('T')[0], event: 'SVGクリック入力テスト対局' }; const requestId = 'kif-req-' + Date.now(); sendObj({ type: 'generateKIF', moves: gameState.moves, gameInfo, requestId }); log('📋 KIF生成リクエスト送信: ' + gameState.moves.length + '手'); updateStatus('KIF生成中...', 'info'); }

    function handleMessage(data) {
      lastRxAt = Date.now(); if (hbGuardTimer) { clearTimeout(hbGuardTimer); hbGuardTimer = null; } switch (data.type) {
        case 'engine': { const raw = data.output || data.line || ''; if (!raw) break; if (raw.startsWith('info')) { const tokens = raw.split(/\s+/); let depth = null, nps = null, scoreType = null, scoreVal = null, pvMoves = []; for (let i = 1; i < tokens.length; i++) { const t = tokens[i]; if (t === 'depth' && tokens[i + 1]) depth = parseInt(tokens[++i], 10); else if (t === 'nps' && tokens[i + 1]) nps = parseInt(tokens[++i], 10); else if (t === 'score' && tokens[i + 2]) { scoreType = tokens[++i]; scoreVal = parseInt(tokens[++i], 10); } else if (t === 'pv') { pvMoves = tokens.slice(i + 1); break; } } const sideToMove = (gameState && (gameState.current_player || gameState.currentPlayer)) || 'b'; const sim = cloneBoardState(); const pvKif = []; let side = sideToMove; for (const mv of pvMoves) { try { const kif = usiToKif(mv, side, (sq) => pieceAtFromBoard(sim, sq), false); pvKif.push(kif); applyMoveToBoardSim(sim, mv, side); side = (side === 'b') ? 'w' : 'b'; } catch { } } const parts = []; if (depth != null) parts.push(`d${depth}`); const dispScore = (scoreType === 'cp' && typeof scoreVal === 'number') ? -scoreVal : scoreVal; if (scoreType) parts.push(`eval ${formatScore(scoreType, dispScore)}`); if (nps != null) parts.push(`NPS ${formatNps(nps)}`); const head = parts.length ? `🧠 ${parts.join(' | ')}` : '🧠'; const tail = pvKif.length ? ` | PV: ${pvKif.join(' ')}` : ''; log(head + tail); try { const jkf = buildJKFJsonFromInfo(raw); if (jkf && (jkf.move || (jkf.comments && jkf.comments.length))) { log('JKF: ' + JSON.stringify(jkf)); } } catch { } return; } if (raw.startsWith('bestmove')) { const m = raw.match(/bestmove\s+(\S+)/); const mv = m && m[1]; if (mv && mv !== 'resign' && mv !== 'win') { const sideToMove = (gameState && (gameState.current_player || gameState.currentPlayer)) || 'b'; const sim = cloneBoardState(); const kif = usiToKif(mv, sideToMove, (sq) => pieceAtFromBoard(sim, sq), false); log(`🤖 候補手: ${kif}`); } else { log(`🤖 候補手: ${mv || raw}`); } return; } log('🗒️ ' + raw); return; }
        case 'pong': return;
        case 'state': try { restoreFromState(data); } catch (e) { log('restoreFromState失敗: ' + e); } return;
  case 'game': if (data.status === 'GAME_OVER') { markThinking(false); gameReady = false; gameInterrupted = true; setBoardEnabled(false); const reason = (data.result && data.result.reason) || ''; const engineWon = (data.result && (data.result.winner === 'engine' || data.result.result === 'engine-win')) || reason === 'resign'; const who = engineWon ? '水匠' : 'あなた'; const msg = `🏁 終局: ${reason} / 勝者: ${who}`; log(msg); try { toast(msg, true); } catch { } return; } if (data.event === 'new') { gameState = data.state || { moves: [], current_player: 'b' }; hasControl = true; gameReady = true; thinking = false; lastLocalMove = null; try { bestmoveController().resetDedup(); } catch {} log('🎮 新規ゲーム開始'); resetHands(); resetToStartpos(); if (gameState.moves && gameState.moves.length) replayMoves(gameState.moves); setBoardEnabled(hasControl); markThinking(false); flushQueuedMove(); } else if (data.event === 'state') { gameState = data.state || gameState || { moves: [], current_player: 'b' }; resetHands(); resetToStartpos(); if (gameState.moves && gameState.moves.length) replayMoves(gameState.moves); gameReady = true; setBoardEnabled(hasControl); markThinking(false); log(`♻️ 状態復元: ${gameState.moves.length || 0}手`); flushQueuedMove(); } else if (data.event === 'humanMove' || data.event === 'human' || data.event === 'move') { gameState = data.state || gameState; const mv = data.lastMove || data.move || data.usi; if (!mv) return; if (mv !== lastLocalMove) { const nextSide = (gameState && (gameState.current_player || gameState.currentPlayer)) || 'b'; const moverSide = nextSide === 'b' ? 'w' : 'b'; const simBefore = cloneBoardState(); const kifTxt = usiToKif(mv, moverSide, (sq) => pieceAtFromBoard(simBefore, sq), true); applyMoveToBoard(mv, { authoritative: true, side: moverSide }); log(`♟️ ${kifTxt}`); pushKif(mv, moverSide); } try { bestmoveController().resetDedup(); } catch {} } else if (data.event === 'bestmove') { try { bestmoveController().onBestmove(data.lastMove || data.move); } catch (e) { log('❌ bestmove適用エラー: ' + e); try { sendObj({ type: 'getState' }); } catch {} } lastLocalMove = null; } break;
  case 'error': log(`💥 エラー [${data.code}]: ${data.message}`); updateStatus(`エラー: ${data.code}`, 'error'); if (data.code === 'NOT_CONTROLLER') { hasControl = false; setBoardEnabled(false); log('⚠ NOT_CONTROLLER → 再要求'); try { sendObj({ type: 'takeControl' }); } catch (e) { } 
    hasControl = true; setBoardEnabled(true); try { flushQueuedMove(); } catch (e) {}
  } if (data.code === 'ILLEGAL_MOVE' || data.code === 'PARSE_ERROR') { log('🏳️ 不正手検出 → 投了扱いで対局終了'); lastBoardSnapshot = null; lastHandsSnapshot = null; lastLocalMove = null; markThinking(false); gameInterrupted = true; setBoardEnabled(false); toast(`不正な指し手 (${data.message || data.move || ''}) により投了扱い`, false); clearSelection(); const ind = document.getElementById('turn-indicator'); if (ind) ind.textContent = '対局終了 (不正手による投了)'; } break;
        case 'parsed': { const d = (typeof data.depth === 'number') ? data.depth : (typeof data['depth(深さ)'] === 'number' ? data['depth(深さ)'] : undefined); const st = data.scoreType; const sv = data.scoreValue; const n = (typeof data.nps === 'number') ? data.nps : (typeof data['nps(探索局面数)'] === 'number' ? data['nps(探索局面数)'] : undefined); const parts = []; if (typeof d === 'number') parts.push(`深さ ${d}`); if (st === 'cp' && typeof sv === 'number') { const disp = -sv; const sign = disp >= 0 ? `+${disp}` : `${disp}`; parts.push(`評価 ${sign}（${advantageLabel(disp)}）`); } else if (st === 'mate' && typeof sv === 'number') { parts.push(`詰み #${sv}`); } if (typeof n === 'number') parts.push(`探索局面数 NPS ${formatNps(n)}`); if (parts.length) log('🧮 ' + parts.join(' | ')); else log('🧮 解析: ' + JSON.stringify(data)); return; }
        default: log('📨 受信: ' + JSON.stringify(data, null, 2));
      }
    }

    function restoreFromState(snap) { if (!snap) return; const moves = snap.moves || []; const side = snap.side_to_move || 'b'; gameState = { moves: moves.slice(), current_player: side }; resetHands(); resetToStartpos(); if (moves.length) replayMoves(moves); gameReady = !!snap.in_game || moves.length > 0; setBoardEnabled(hasControl); markThinking(false); log(`♻️ 状態復元(state): ${moves.length}手 / 手番=${side}`); }

    function applyMoveToBoard(usi, opts = {}) {
      if (!usi) return false; const optimistic = !!opts.optimistic; log(`🔄 盤面反映: ${usi}${optimistic ? ' (optimistic)' : ''}`); try {
        if (usi.includes('*')) { const letter = usi[0]; const targetSq = usi.slice(2, 4); const { x, y } = usiSqToXY(targetSq); if (boardState[y][x]) { log('⚠️ 打ち先に駒があります: ' + targetSq); return false; } const sideDetected = opts.side || (gameState && (gameState.current_player || gameState.currentPlayer)) || 'b'; const piecePlaced = sideDetected === 'b' ? letter.toUpperCase() : letter.toLowerCase(); boardState[y][x] = piecePlaced; useHandPieceForDrop(letter, sideDetected); const pieceText = document.getElementById(`piece-${x}-${y}`); if (pieceText) { pieceText.textContent = pieceNames[piecePlaced] || piecePlaced; pieceText.style.fill = piecePlaced === piecePlaced.toUpperCase() ? '#000' : '#c00'; pieceText.setAttribute('data-piece', piecePlaced); setPieceOrientation(pieceText, piecePlaced); } else { const svg = document.getElementById('shogi-board'); const text = document.createElementNS('http://www.w3.org/2000/svg', 'text'); text.setAttribute('x', BOARD_OFFSET_X + x * CELL_SIZE + CELL_SIZE / 2); text.setAttribute('y', BOARD_OFFSET_Y + y * CELL_SIZE + CELL_SIZE / 2); text.setAttribute('text-anchor', 'middle'); text.setAttribute('alignment-baseline', 'middle'); text.setAttribute('font-size', '18'); text.setAttribute('font-weight', 'bold'); text.classList.add('piece-text'); text.setAttribute('data-file', x); text.setAttribute('data-rank', y); text.setAttribute('id', `piece-${x}-${y}`); text.setAttribute('data-piece', piecePlaced); text.textContent = pieceNames[piecePlaced] || piecePlaced; text.style.fill = piecePlaced === piecePlaced.toUpperCase() ? '#000' : '#c00'; setPieceOrientation(text, piecePlaced); svg.appendChild(text); } } else {
          const fromSq = usi.slice(0, 2); const toSq = usi.slice(2, 4); const promote = usi.endsWith('+'); const from = usiSqToXY(fromSq); const to = usiSqToXY(toSq); let piece = boardState[from.y][from.x]; if (!piece) { log(`⚠️ 移動元が空: ${fromSq}`); return false; } let captured = boardState[to.y][to.x]; if (promote) { piece = '+' + piece.replace('+', ''); } boardState[to.y][to.x] = piece; boardState[from.y][from.x] = null; const fromPieceText = document.getElementById(`piece-${from.x}-${from.y}`); if (fromPieceText) fromPieceText.remove(); const toPieceText = document.getElementById(`piece-${to.x}-${to.y}`); if (captured) { addCaptureToHand(captured); }
          if (toPieceText) { toPieceText.textContent = pieceNames[piece] || piece; toPieceText.style.fill = piece.toLowerCase() === piece ? '#c00' : '#000'; toPieceText.setAttribute('data-piece', piece); setPieceOrientation(toPieceText, piece); } else { const svg = document.getElementById('shogi-board'); const text = document.createElementNS('http://www.w3.org/2000/svg', 'text'); text.setAttribute('x', BOARD_OFFSET_X + to.x * CELL_SIZE + CELL_SIZE / 2); text.setAttribute('y', BOARD_OFFSET_Y + to.y * CELL_SIZE + CELL_SIZE / 2); text.setAttribute('text-anchor', 'middle'); text.setAttribute('alignment-baseline', 'middle'); text.setAttribute('font-size', '18'); text.setAttribute('font-weight', 'bold'); text.classList.add('piece-text'); text.setAttribute('data-file', to.x); text.setAttribute('data-rank', to.y); text.setAttribute('id', `piece-${to.x}-${to.y}`); text.setAttribute('data-piece', piece); text.textContent = pieceNames[piece] || piece; text.style.fill = piece.toLowerCase() === piece ? '#c00' : '#000'; setPieceOrientation(text, piece); svg.appendChild(text); }
        } return true;
      } catch (e) { log(`💥 applyMoveToBoard失敗: ${e}`); return false; }
    }

    function resetToStartpos() { boardState = createStartpos(); document.querySelectorAll('.piece-text').forEach(el => el.remove()); const svg = document.getElementById('shogi-board'); for (let rank = 0; rank < 9; rank++) { for (let file = 0; file < 9; file++) { const piece = boardState[rank][file]; if (piece) { const text = document.createElementNS('http://www.w3.org/2000/svg', 'text'); text.setAttribute('x', BOARD_OFFSET_X + file * CELL_SIZE + CELL_SIZE / 2); text.setAttribute('y', BOARD_OFFSET_Y + rank * CELL_SIZE + CELL_SIZE / 2); text.setAttribute('text-anchor', 'middle'); text.setAttribute('alignment-baseline', 'middle'); text.setAttribute('font-size', '18'); text.setAttribute('font-weight', 'bold'); text.classList.add('piece-text'); text.setAttribute('data-file', file); text.setAttribute('data-rank', rank); text.setAttribute('id', `piece-${file}-${rank}`); text.textContent = pieceNames[piece] || piece; text.style.fill = piece === piece.toUpperCase() ? '#000' : '#c00'; setPieceOrientation(text, piece); svg.appendChild(text); } } } log('🔄 盤面リセット完了'); }
    function replayMoves(moves) { if (!moves || moves.length === 0) return; log(`🔄 手順再生: ${moves.length}手`); moves.forEach((mv, i) => { log(`  ${i + 1}手目: ${mv}`); applyMoveToBoard(mv); }); }
    function displayKIF(kifContent) { const w = window.open('', '_blank', 'width=600,height=400'); w.document.write(`<html><head><title>生成されたKIF</title></head><body style="font-family: monospace; white-space: pre; padding: 20px;">${kifContent}</body></html>`); }
    function updateStatus(message, type) { const el = document.getElementById('status'); el.textContent = message; el.className = 'status ' + type; }
    function log(message) { const el = document.getElementById('log'); const ts = new Date().toLocaleTimeString(); el.textContent += '[' + ts + '] ' + message + '\n'; el.scrollTop = el.scrollHeight; }
    function clearLog() { document.getElementById('log').textContent = 'ログクリア...\n'; }
    function toast(message, isSuccess = true) { const sEl = document.getElementById('status'); const orig = sEl.textContent; const cls = sEl.className; updateStatus(message, isSuccess ? 'connected' : 'error'); setTimeout(() => { sEl.textContent = orig; sEl.className = cls; }, 3000); }
    function clearSelection() { if (selectedSquare) { selectedSquare.square.classList.remove('selected'); selectedSquare = null; } if (selectedDropPiece) { const pieceEl = document.querySelector(`[data-piece="${selectedDropPiece}"].selected`); if (pieceEl) pieceEl.classList.remove('selected'); selectedDropPiece = null; } document.querySelectorAll('.square.possible').forEach(sq => sq.classList.remove('possible')); legalTargets.clear(); }
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { clearSelection(); document.getElementById('promotionModal').style.display = 'none'; if (pendingMove) { log('成り選択キャンセル'); pendingMove = null; } } });
    window.onload = function () { boardState = createStartpos(); initSVGBoard(); updateKomadaiDisplay(); log('🎌 SVG将棋盤クリック入力システム起動（駒台対応）'); updateStatus('自動接続中...', 'info'); };
  // デバッグ用: メトリクスを覗けるように露出
  try { window.debugBestmoveStats = () => (bestmoveController().getStats && bestmoveController().getStats()) || {}; } catch {}
  </script>
