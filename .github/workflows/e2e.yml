name: e2e-windows
on: [push, pull_request]
jobs:
  e2e:
    runs-on: windows-latest
    steps:
      # 方式A: SSH + デプロイキー（有効化済み）
      - name: Use deploy key for submodules (SSH)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SUBMOD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf "Host github.com\n  StrictHostKeyChecking no\n" >> ~/.ssh/config
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # 方式B: HTTPS + PAT を使う場合は、上のSSH手順ではなくこちらを使う（例）
      # token: ${{ secrets.SUBMOD_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest websocket-client
      - name: Set env (example)
        run: |
          echo USI_BRIDGE_PORT=8787>> $env:GITHUB_ENV
          echo USI_BRIDGE_TOKEN=TEST>> $env:GITHUB_ENV
          echo POWERSHELL_EXE=$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe>> $env:GITHUB_ENV
          echo PYTEST_USE_FLASK=0>> $env:GITHUB_ENV
          echo USI_ENGINE_PATH=tools\mock_engine\mock_engine.bat>> $env:GITHUB_ENV
      - name: Run E2E
        run: |
          pytest -q tests/test_engine_e2e.py
      - name: Upload bridge logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: usi-bridge-logs
          path: logs/usi-bridge/**
          if-no-files-found: ignore
